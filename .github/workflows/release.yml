name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # gh release create

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          version="$(tr -d '[:space:]' <VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}$'; then
            echo "error: VERSION holds '$version', expected 1-4 dot-separated numbers" >&2
            exit 1
          fi
          # build.sh stamps the version into the binary with -X main.version, and
          # `jrp --version` prints it, so a tag that disagreed with VERSION would
          # publish a binary contradicting the release it is published under. Fail
          # before anything is built.
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match VERSION (expected v$version)" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Build all targets
        run: bash build.sh "${{ steps.version.outputs.version }}"

      # The ldflags stamp is the one thing no test covers. Only the linux/amd64
      # binary can be run here.
      - name: Verify the stamp
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          reported="$(./dist/jrp_linux_amd64 --version)"
          if [ "$reported" != "jrp $VERSION" ]; then
            echo "error: the binary reports '$reported', expected 'jrp $VERSION'" >&2
            exit 1
          fi

      - name: Package platform archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for binary in dist/jrp_*; do
            name="$(basename "$binary")"
            platform="${name#jrp_}"
            platform="${platform%.exe}"

            payload="jrp-${VERSION}"
            rm -rf "staging/${platform}"
            mkdir -p "staging/${platform}/${payload}"

            if [[ "$binary" == *.exe ]]; then
              cp "$binary" "staging/${platform}/${payload}/jrp.exe"
            else
              cp "$binary" "staging/${platform}/${payload}/jrp"
              chmod +x "staging/${platform}/${payload}/jrp"
            fi

            cp dist-readme.txt "staging/${platform}/${payload}/readme.txt"
            cp LICENSE "staging/${platform}/${payload}/LICENSE"

            artifact_name="jrp-${VERSION}-${platform//_/-}.zip"
            (cd "staging/${platform}" && zip -r -q "../../artifacts/${artifact_name}" "${payload}")
            echo "packaged artifacts/${artifact_name}"
          done
          ls -l artifacts

      # Lets a download be checked, and lets the AUR packages verify the zips
      # they are built from against what this run produced.
      - name: Checksums
        working-directory: artifacts
        run: sha256sum *.zip >SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jrp-${{ steps.version.outputs.version }}-archives
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0 # the payload is already-compressed archives

      # Gated on the tag, so a workflow_dispatch run is a full rehearsal –
      # build, artifacts – that publishes nothing.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archives=(artifacts/jrp-"$VERSION"-*.zip)
          if [ "${#archives[@]}" -ne 5 ]; then
            echo "error: expected 5 archives, found ${#archives[@]}" >&2
            printf '  %s\n' "${archives[@]}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "JSON Really Pretty ${VERSION}" \
            --generate-notes \
            "${archives[@]}" artifacts/SHA256SUMS.txt
